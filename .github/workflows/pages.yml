# Publishes the web page (web/) to GitHub Pages:
#   https://manofkimchi08.github.io/ai-guitar-transcriber/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The page only talks to the engine running on the visitor's own PC (engine.py).
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
