# Publishes a GitHub Release for a version tag (v1.3.0, ...): the title and body come
# from docs/releases/<tag>.md (first line = title), and the release carries a
# ready-to-run zip of the repository with the launcher exe built from that commit's
# Launcher.cs. It runs when the tag is pushed, or by hand ("Run workflow", with the
# tag): a tag that does not exist yet is created on `target`, an existing one has its
# release updated.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish or update, e.g. v1.3.0"
        required: true
      target:
        description: "Branch or commit to tag when the tag does not exist yet"
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}
          fetch-depth: 0
      - name: Use the tag's commit when the tag exists
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            git checkout -q "refs/tags/${TAG}"
          fi
          git log --oneline -1
      - name: Build AI_Band_Transcriber.exe with build_launcher.bat
        shell: cmd
        run: echo.| build_launcher.bat
      - name: Zip the app with the fresh launcher
        shell: bash
        run: |
          git ls-files > files.txt
          7z a -tzip "AI_Band_Transcriber_${TAG}.zip" @files.txt -scsUTF-8
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${TAG}.md"
          test -f "$notes" || { echo "No release notes at $notes"; exit 1; }
          title="$(head -n 1 "$notes" | sed 's/^# *//')"
          tail -n +2 "$notes" > release_body.md
          zip="AI_Band_Transcriber_${TAG}.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file release_body.md
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" --target "$(git rev-parse HEAD)" --title "$title" --notes-file release_body.md
          fi
